{% extends "base.html" %}
{% block content %}
<section class="panel confirm-panel">
  <h2>Log out of StockFlow?</h2>
  <p>You'll need to sign in again to access inventory records.</p>
  <form method="post">{% csrf_token %}<button class="primary" type="submit">Log out</button> <a class="secondary" href="{% url 'dashboard' %}">Cancel</a></form>
</section>
{% endblock %}
