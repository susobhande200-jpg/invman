{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | StockFlow</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-page">
  <main class="loginbox">
    <a class="brand login-brand" href="{% url 'login' %}">STOCK<span>FLOW</span></a>
    <p class="login-subtitle">Inventory Management System</p>
    {% if messages %}{% for message in messages %}<div class="alert {{ message.tags }}">{{ message }}</div>{% endfor %}{% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="username">Username</label>
      <input id="username" type="text" name="username" placeholder="Enter your username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
      <button class="primary login-submit" type="submit">Sign in</button>
    </form>
    <p class="login-note">Sign in with your assigned account.</p>
  </main>
</body>
</html>
